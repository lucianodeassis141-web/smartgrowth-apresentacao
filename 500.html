<style>
@font-face { font-family: Figtree; src: url(/assets/Figtree.woff2) format("woff2"); font-weight: 300 900; font-display: swap; }
* { box-sizing: border-box; }
body { margin: 0; min-height: 100vh; min-height: 100svh; display: flex; flex-direction: column; justify-content: space-between; gap: 48px; padding: 32px clamp(20px, 5vw, 80px); background: radial-gradient(120% 90% at 85% 10%, #1B2547 0, #0A0D18 60%); color: #F4F5F8; font: 400 17px/1.55 Figtree, system-ui, sans-serif; }

main { max-width: 760px; }
.cod { font-size: 15px; font-weight: 700; letter-spacing: .12em; color: #FA7715; }
h1 { margin: 12px 0 0; font-size: clamp(2.4rem, 6vw, 4.6rem); line-height: 1.02; font-weight: 800; letter-spacing: -.035em; }
p { margin: 18px 0 0; font-size: 19px; color: #B9BED0; max-width: 32em; }
.acoes { display: flex; flex-wrap: wrap; gap: 12px; margin-top: 32px; }
.btn { display: inline-flex; align-items: center; min-height: 52px; padding: 0 26px; border-radius: 10px; background: #FA7715; color: #11141F; font-weight: 700; text-decoration: none; }
.btn:hover { background: #E85F08; }
.btn-claro { background: transparent; color: #F4F5F8; box-shadow: inset 0 0 0 1.5px rgba(255,255,255,.28); }
.btn-claro:hover { background: rgba(255,255,255,.08); }

footer { font-size: 14px; color: #B9BED0; }

  <div class="acoes"><a class="btn" href="/">Ir para o início</a><a class="btn btn-claro" href="/#contato">Pedir diagnóstico</a></div>
